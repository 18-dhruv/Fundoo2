$kind: http-request
url: "{{baseUrl}}/api/notes/{{noteId}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "title": "Updated title",
      "content": "Hello from Postman",
      "color": "#FFF475",
      "isPinned": true
    }
auth:
  type: bearer
  credentials:
    token: "{{accessToken}}"
scripts:
  - type: afterResponse
    code: pm.test('status is one of [200]', () => pm.expect(pm.response.code).to.be.oneOf([200]));
    language: text/javascript
order: 4000
