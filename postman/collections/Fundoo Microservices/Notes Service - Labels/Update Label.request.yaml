$kind: http-request
url: "{{baseUrl}}/api/labels/{{labelId}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "Work-Renamed"
    }
auth:
  type: bearer
  credentials:
    token: "{{accessToken}}"
scripts:
  - type: afterResponse
    code: pm.test('status is one of [200]', () => pm.expect(pm.response.code).to.be.oneOf([200]));
    language: text/javascript
order: 3000
