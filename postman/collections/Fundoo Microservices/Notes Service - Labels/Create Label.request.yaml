$kind: http-request
url: "{{baseUrl}}/api/labels"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "Work"
    }
auth:
  type: bearer
  credentials:
    token: "{{accessToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('status is one of [201]', () => pm.expect(pm.response.code).to.be.oneOf([201]));
      const j = pm.response.json();
      pm.collectionVariables.set('labelId', j.data.id);
    language: text/javascript
order: 1000
