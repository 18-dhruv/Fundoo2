$kind: http-request
url: "{{baseUrl}}/api/notes/{{noteId}}"
method: DELETE
auth:
  type: bearer
  credentials:
    token: "{{accessToken}}"
scripts:
  - type: afterResponse
    code: pm.test('status is one of [200, 204]', () => pm.expect(pm.response.code).to.be.oneOf([200, 204]));
    language: text/javascript
order: 8000
