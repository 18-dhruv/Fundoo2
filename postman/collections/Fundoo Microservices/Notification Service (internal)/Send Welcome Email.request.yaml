$kind: http-request
url: "{{notificationUrl}}/api/notifications/welcome"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "recipientEmail": "{{email}}",
      "recipientName": "Test User"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: pm.test('status is one of [202]', () => pm.expect(pm.response.code).to.be.oneOf([202]));
    language: text/javascript
order: 1000
