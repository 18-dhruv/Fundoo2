$kind: http-request
url: "{{baseUrl}}/api/auth/forgot-password"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "{{email}}"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: pm.test('status is one of [200]', () => pm.expect(pm.response.code).to.be.oneOf([200]));
    language: text/javascript
order: 4000
