$kind: http-request
description: "`resetToken` comes from the password-reset email."
url: "{{baseUrl}}/api/auth/reset-password"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "{{email}}",
      "token": "{{resetToken}}",
      "newPassword": "{{newPassword}}"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: pm.test('status is one of [200, 400]', () => pm.expect(pm.response.code).to.be.oneOf([200, 400]));
    language: text/javascript
order: 5000
