# TEMPLATE ONLY - do not commit real values.
# Copy to secrets.yaml (git-ignored), fill in, then:  kubectl apply -f deploy/k8s/secrets.yaml
# Or create it straight from the CLI - see deploy/AZURE_DEPLOY.md step 6.
apiVersion: v1
kind: Secret
metadata:
  name: fundoo-secrets
  namespace: fundoo
type: Opaque
stringData:
  # Azure Database for PostgreSQL Flexible Server (SSL is required by Azure)
  ConnectionStrings__UserDb: "Host=<server>.postgres.database.azure.com;Port=5432;Database=fundoo_users;Username=<admin>;Password=<password>;Ssl Mode=Require"
  ConnectionStrings__NotesDb: "Host=<server>.postgres.database.azure.com;Port=5432;Database=fundoo_notes;Username=<admin>;Password=<password>;Ssl Mode=Require"
  # Same key must be used by User API (issues tokens) and Notes API (validates them). 32+ chars.
  Jwt__SigningKey: "<long-random-string>"
  InternalService__SharedSecret: "<long-random-string>"
  # SMTP used by the Notification API (e.g. Gmail app password, SendGrid, Mailtrap)
  EmailSettings__Host: "smtp.gmail.com"
  EmailSettings__Port: "587"
  EmailSettings__SenderEmail: "<sender@example.com>"
  EmailSettings__SenderName: "Fundoo"
  EmailSettings__Username: "<smtp-user>"
  EmailSettings__Password: "<smtp-password>"
  # Optional - leave empty to disable Google SSO
  Authentication__Google__ClientId: ""
  Authentication__Google__ClientSecret: ""
